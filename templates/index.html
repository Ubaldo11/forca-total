<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-image: url('static/images/Academia.jpg');
        }
        ul{
            background-color: black;
            width: 100%;  /*  ocupa 100% da tela */
            max-width: 1000px;  /* limite máximo */
            list-style-type: none;
            margin: 0 auto;  /* ← Centraliza */
            padding: 0;
            display: flex;  /*  flexível */
            flex-wrap: wrap;  /*  quebra linha se necessário */
            justify-content: center;  /*  centraliza itens */
            gap: 20px;  /*  espaçamento entre itens */
        }
        li {width: auto;  /* largura automática */
            margin: 0;  /* sem margem fixa */
            padding: 0;  /* sem padding fixo */
            float: none;  /*  remove o float */
            color: black;
                }
        a{
            font-size: 15px;
            display: block;
            text-decoration: none;
            padding: 10px 20px;  /* padding em px */
            color: orangered;
            border-radius: 25px;  /*borda arredondada */
            transition: all 0.3s ease;  /* animação suave */
            white-space: nowrap;  /* evita quebrar texto */
                } 

        a:hover {
        
        font-size: 16px;  /*aumento mais sutil */
        display: block;
        text-decoration: none;
        padding: 10px 20px;
        color: black;
        background:  #FFD700;  /*  fundo no hover */
        transform: scale(1.05);  /* aumenta sem empurrar */
            }

        .usuario {background-color: black;
            width: 100%;  /*  ocupa 100% da tela */
            max-width: 1000px;  /* limite máximo */
            list-style-type: none;
            margin: 0 ;  /* ← Centraliza */
            padding: 20px 30px;
            display: flex;  /*  flexível */
            flex-wrap: wrap;  /*  quebra linha se necessário */
            justify-content: flex-start;  /*  centraliza itens */
            gap: 20px;  /*  espaçamento entre itens */
            
            

        }
        
        /* ===== RESPONSIVIDADE ===== */ 
        /*Atestado de uso de Inteligencia Artificial 
        /* TABLET (telas menores que 768px) */
        @media (max-width: 768px) {
            ul {
                gap: 5px;  /* Espaço menor entre itens */
            }
            
            li a {
                font-size: 13px;
                padding: 8px 14px;
            }
            
            li a:hover {
                font-size: 14px;
                padding: 8px 14px;
            }
        }

        /* CELULAR (telas menores que 480px) */
        @media (max-width: 480px) {
            ul {
                flex-direction: column;  /* ← Muda: menu vira coluna */
                align-items: center;
                gap: 3px;
            }
            
            li {
                width: 100%;  /* Cada item ocupa toda largura */
                text-align: center;
            }
            
            li a {
                font-size: 14px;
                padding: 10px 20px;
                width: 100%;  /* Link ocupa toda largura do item */
                text-align: center;
                border-radius: 10px;
            }
            
            li a:hover {
                font-size: 15px;
                padding: 10px 20px;
            }
        }

        /* CELULAR PEQUENO (telas menores que 360px) */
        @media (max-width: 360px) {
            li a {
                font-size: 12px;
                padding: 8px 15px;
            }
        }
        /* fim do uso de inteligencia artificial */

                .btn-sair {
            color: #FF6B00;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 10px 18px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-sair:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>
    <ul id="principal"> 
        
        <li class="abas">
            <a href="{{ url_for('treino') }}">Monte seu Treino </a>   
        </li>
        
        <li class="abas">
            <a href="{{ url_for('loc') }}">Encontre Academia</a>
        </li>
        
        
        <li class="abas">
            <a href="{{ url_for('musica') }}">Musicas</a>
        </li>
        
         <li >  
            <a href="{{ url_for('login') }}">{% if logado %}
        <span>Olá, {{ nome }}!</span>
        {% else %}
            <a href="{{ url_for('login') }}">Entrar</a>
        {% endif %}</a>
        {% if logado %}
            <span>Olá, {{ nome }}!</span>
            <a href="{{ url_for('logout') }}" class="btn-sair">Sair</a>
        {% endif %}
            </li>

    </ul>
    

 

</body>
</html>
